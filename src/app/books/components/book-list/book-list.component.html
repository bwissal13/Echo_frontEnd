<div class="book-container">
  <!-- Left Sidebar -->
  <app-sidebar></app-sidebar>

  <!-- Main Content -->
  <main class="main-content">
    <div class="flex justify-between items-center mb-6">
      <app-search-bar></app-search-bar>
      <button mat-raised-button color="primary" (click)="fileInput.click()" *ngIf="isAuthor">
        <mat-icon>image</mat-icon>
        Change Cover
      </button>
      <input #fileInput type="file" hidden (change)="onFileSelected($event)" accept="image/*">
    </div>

    <!-- Loading spinner -->
    <app-loading-spinner *ngIf="loading"></app-loading-spinner>

    <!-- Error message -->
    <app-error-message *ngIf="error" [message]="error"></app-error-message>

    <!-- Books grid -->
    <div class="book-grid" *ngIf="!loading && !error && books.length > 0">
      <app-book-card 
        *ngFor="let book of books" 
        [book]="book"
        [imageUrl]="getImageUrl(book.coverImage)"
        (selectBook)="selectBook(book, $event)"
      ></app-book-card>
    </div>

    <!-- Pagination -->
    <mat-paginator
      *ngIf="!loading && !error && books.length > 0"
      [length]="totalBooks"
      [pageSize]="pageSize"
      [pageSizeOptions]="pageSizeOptions"
      [pageIndex]="currentPage"
      (page)="onPageChange($event)"
      aria-label="Select page">
    </mat-paginator>

    <!-- Empty state -->
    <app-empty-state 
      *ngIf="!loading && !error && books.length === 0"
      [isAuthor]="isAuthor"
    ></app-empty-state>
  </main>
</div>
