<div class="books-container">
  <div class="books-header">
    <h2>My Books</h2>
    <button mat-raised-button color="primary" routerLink="/books/new" *ngIf="isAuthor">
      <mat-icon>add</mat-icon>
      New Book
    </button>
  </div>

  <!-- Loading spinner -->
  <mat-spinner *ngIf="loading" diameter="40" class="loading-spinner"></mat-spinner>

  <!-- Error message -->
  <div *ngIf="error" class="error-message">
    {{ error }}
  </div>

  <!-- Books list -->
  <div class="books-grid" *ngIf="!loading && !error && books.length > 0">
    <mat-card *ngFor="let book of books" class="book-card" [routerLink]="['/books/edit', book.id]">
      <img mat-card-image [src]="book.coverImage || 'assets/images/default-cover.jpg'" [alt]="book.title">
      <mat-card-content>
        <h3>{{ book.title }}</h3>
        <p class="book-genre">{{ book.genre }}</p>
        <p class="book-status" [class.published]="book.isPublic">
          {{ getStatusLabel(book) }}
        </p>
        <p class="book-date">Last updated: {{ book.updatedAt | date:'short' }}</p>
      </mat-card-content>
    </mat-card>
  </div>

  <!-- Empty state -->
  <div *ngIf="!loading && !error && books.length === 0" class="empty-state">
    <mat-icon>library_books</mat-icon>
    <h3>No books yet</h3>
    <p>Start writing your first book!</p>
    <button mat-raised-button color="primary" routerLink="/books/new" *ngIf="isAuthor">
      Create New Book
    </button>
  </div>

  <!-- Pagination -->
  <mat-paginator *ngIf="totalBooks > 0"
    [length]="totalBooks"
    [pageSize]="pageSize"
    [pageSizeOptions]="[5, 10, 25, 50]"
    [showFirstLastButtons]="true"
    (page)="onPageChange($event)">
  </mat-paginator>
</div>
