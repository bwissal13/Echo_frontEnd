<div class="notion-container">
  <!-- Minimal Top Bar -->
  <div class="top-bar">
    <div class="left-actions">
      <button mat-icon-button (click)="goBack()" class="back-button">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <div class="page-info">
        <div class="breadcrumb">My Books / {{ bookTitle || 'Untitled' }}</div>
        <div class="last-edited">Last edited {{ lastEdited | date:'shortTime' }}</div>
      </div>
    </div>
    <div class="right-actions">
      <button mat-button class="share-button" [disabled]="!isBookSaved">
        <mat-icon>share</mat-icon>
        Share
      </button>
      <button mat-button [matMenuTriggerFor]="genreMenu">
        <mat-icon>category</mat-icon>
        {{ selectedGenre || 'Select Genre' }}
      </button>
      <button mat-button [matMenuTriggerFor]="moreMenu">
        <mat-icon>more_horiz</mat-icon>
      </button>
    </div>
  </div>

  <!-- Add error message display -->
  <div *ngIf="errorMessage" class="error-banner">
    {{ errorMessage }}
    <button mat-icon-button (click)="dismissError()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Main Content Area -->
  <div class="content-area">
    <!-- Cover Image Section -->
    <div class="cover-section" [style.backgroundImage]="coverImageUrl || 'none'">
      <input #fileInput type="file" hidden (change)="onFileSelected($event)" accept="image/*">
      <button mat-icon-button class="change-cover" (click)="fileInput.click()">
        <mat-icon>{{ coverImageUrl ? 'edit' : 'add_photo_alternate' }}</mat-icon>
      </button>
    </div>

    <!-- Title Section -->
    <div class="title-section">
      <input 
        [(ngModel)]="bookTitle"
        (ngModelChange)="onTitleChange()"
        class="title-input" 
        placeholder="Enter your book title..."
        required
      >
    </div>

    <!-- Description Editor -->
    <div class="content-section">
      <textarea
        [(ngModel)]="bookContent"
        (ngModelChange)="onContentChange($event)"
        class="description-textarea"
        placeholder="Write your book description here..."
        rows="10">
      </textarea>
    </div>

    <!-- Chapters Section -->
    <div class="chapters-section">
      <div class="section-header" *ngIf="chapters.length > 0">
        <mat-icon>menu_book</mat-icon>
        <span>Chapters</span>
        <span class="chapter-count">{{ chapters.length }}</span>
      </div>
      
      <app-chapter-list
        *ngIf="chapters.length > 0"
        [chapters]="chapters"
        (editChapter)="editChapter($event)"
        (deleteChapter)="deleteChapter($event)"
        (chaptersReordered)="onChaptersReordered($event)">
      </app-chapter-list>

      <div class="add-chapter-prompt" *ngIf="chapters.length === 0">
        <button mat-button (click)="addSubpage()">
          <mat-icon>add_box</mat-icon>
          Add a subpage
        </button>
        <button mat-button (click)="addInlinePage()">
          <mat-icon>post_add</mat-icon>
          Add inline
        </button>
      </div>
    </div>
  </div>
</div>

<mat-menu #genreMenu="matMenu">
  <button mat-menu-item *ngFor="let genre of genres" (click)="selectGenre(genre)">
    {{ genre }}
  </button>
</mat-menu>

<mat-menu #moreMenu="matMenu">
  <button mat-menu-item [matMenuTriggerFor]="genreMenu">
    <mat-icon>category</mat-icon>
    Select Genre
  </button>
  <button mat-menu-item (click)="saveBook()">
    <mat-icon>save</mat-icon>
    Save as draft
  </button>
  <button mat-menu-item (click)="publish()">
    <mat-icon>publish</mat-icon>
    Publish
  </button>
  <mat-divider></mat-divider>
  <button mat-menu-item (click)="fileInput.click()">
    <mat-icon>image</mat-icon>
    Change cover
  </button>
</mat-menu>
