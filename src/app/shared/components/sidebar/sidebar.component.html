<aside class="sidebar" [class.collapsed]="!(isExpanded$ | async)">
  <button class="toggle-btn" (click)="toggleSidebar()">
    <mat-icon>{{ (isExpanded$ | async) ? 'chevron_left' : 'chevron_right' }}</mat-icon>
  </button>
  
  <div class="menu-items">
    <a routerLink="/dashboard" class="menu-item" routerLinkActive="active">
      <mat-icon>home</mat-icon>
      <span *ngIf="isExpanded$ | async">Home</span>
    </a>
    <ng-container *ngIf="isAuthenticated$ | async">
      <a routerLink="/books" class="menu-item" routerLinkActive="active">
        <mat-icon>library_books</mat-icon>
        <span *ngIf="isExpanded$ | async">My Books</span>
      </a>
      <a routerLink="/books/bookmarks" class="menu-item" routerLinkActive="active">
        <mat-icon>bookmark</mat-icon>
        <span *ngIf="isExpanded$ | async">Bookmarks</span>
      </a>
      <a routerLink="/books/new" class="menu-item create-book" routerLinkActive="active">
        <mat-icon>add_circle</mat-icon>
        <span *ngIf="isExpanded$ | async">Create New Book</span>
      </a>
      <a routerLink="/books/public" class="menu-item" routerLinkActive="active">
        <mat-icon>public</mat-icon>
        <span *ngIf="isExpanded$ | async">Public Books</span>
      </a>
      <a routerLink="/authors" class="menu-item" routerLinkActive="active">
        <mat-icon>people</mat-icon>
        <span *ngIf="isExpanded$ | async">Authors</span>
      </a>
      <a routerLink="/books/saved-phrases" class="menu-item" routerLinkActive="active">
        <mat-icon>bookmark</mat-icon>
        <span *ngIf="isExpanded$ | async">Saved Phrases</span>
      </a>
      <a routerLink="/role-request" class="menu-item" routerLinkActive="active">
        <mat-icon>upgrade</mat-icon>
        <span *ngIf="isExpanded$ | async">Request Role Change</span>
      </a>

      <!-- Admin Section -->
      <ng-container *ngIf="isAdmin">
        <div class="menu-divider" *ngIf="isExpanded$ | async">Admin</div>
        
        <a routerLink="/admin/dashboard" class="menu-item" routerLinkActive="active">
          <mat-icon>admin_panel_settings</mat-icon>
          <span *ngIf="isExpanded$ | async">Admin Dashboard</span>
        </a>
        
        <a routerLink="/admin/users" class="menu-item" routerLinkActive="active">
          <mat-icon>manage_accounts</mat-icon>
          <span *ngIf="isExpanded$ | async">User Management</span>
        </a>
        
        <a routerLink="/admin/role-requests" class="menu-item" routerLinkActive="active">
          <mat-icon>assignment_ind</mat-icon>
          <span *ngIf="isExpanded$ | async">Role Requests</span>
        </a>
      </ng-container>
    </ng-container>
  </div>

  <div class="footer-actions" *ngIf="isAuthenticated$ | async">
    <button class="menu-item logout-btn" (click)="logout()">
      <mat-icon>exit_to_app</mat-icon>
      <span *ngIf="isExpanded$ | async">Logout</span>
    </button>
  </div>
</aside>
