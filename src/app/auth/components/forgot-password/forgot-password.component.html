<div class="auth-container">
  <div class="auth-card">
    <!-- Header -->
    <div class="text-center space-y-3 mb-8">
      <h1 class="text-3xl font-bold tracking-tight text-slate-800">
        Recover Your Account
      </h1>
      <p class="text-base text-slate-600">
        Don't worry! Just enter your email below and we'll send you instructions to reset your password.
      </p>
    </div>

    <!-- Form -->
    <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="auth-form">
      <!-- Email Field -->
      <div class="form-group">
        <label class="form-label">Email address</label>
        <input 
          type="email" 
          formControlName="email"
          class="form-input"
          placeholder="john@example.com">
        <div *ngIf="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched" 
             class="form-error">
          {{ getErrorMessage('email') }}
        </div>
      </div>

      <!-- Submit Button -->
      <button 
        type="submit"
        [disabled]="forgotPasswordForm.invalid || loading"
        class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-slate-700 hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-500 disabled:opacity-50 disabled:cursor-not-allowed">
        <mat-spinner *ngIf="loading" [diameter]="20" class="mr-2"></mat-spinner>
        <span *ngIf="!loading">Send reset link</span>
      </button>

      <!-- Back to Login -->
      <div class="text-center text-sm text-slate-600">
        Remember your password? 
        <a routerLink="/auth/login" class="font-medium text-slate-700 hover:text-slate-900">Back to login</a>
      </div>
    </form>
  </div>
</div>
