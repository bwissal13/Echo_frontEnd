<div class="auth-container">
  <div class="auth-card">
   
    <!-- Header -->
    <div class="text-center space-y-3 mb-8">
      <h1 class="text-3xl font-bold tracking-tight text-slate-800">
        Welcome Back
      </h1>
      <p class="text-base text-slate-600">
        Sign in to your account to continue
      </p>
    </div>

    <!-- Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <!-- Email Field -->
      <div class="form-group">
        <label class="form-label">Email address</label>
        <input 
          type="email" 
          formControlName="email"
          class="form-input"
          placeholder="john@example.com">
        <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" 
             class="form-error">
          {{ getErrorMessage('email') }}
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <div class="flex items-center justify-between">
          <label class="form-label">Password</label>
          <a routerLink="/auth/forgot-password" class="text-sm font-medium text-slate-700 hover:text-slate-900">
            Forgot password?
          </a>
        </div>
        <div class="relative">
          <input 
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            class="form-input pr-10"
            placeholder="••••••••">
          <button 
            type="button"
            (click)="hidePassword = !hidePassword"
            class="absolute right-2 top-1/2 -translate-y-1/2 p-1 text-gray-400 hover:text-gray-600">
            <mat-icon class="text-[20px]">{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
        </div>
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" 
             class="form-error">
          {{ getErrorMessage('password') }}
        </div>
      </div>

      <!-- Remember Me -->
      <div class="flex items-center space-x-2">
        <input 
          type="checkbox" 
          formControlName="rememberMe"
          class="h-4 w-4 rounded border-gray-300 text-slate-700 focus:ring-slate-500">
        <label class="text-sm text-slate-600">
          Remember me
        </label>
      </div>

      <!-- Submit Button -->
      <button 
        type="submit"
        [disabled]="loginForm.invalid || loading"
        class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-slate-700 hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-500 disabled:opacity-50 disabled:cursor-not-allowed">
        <mat-spinner *ngIf="loading" [diameter]="20" class="mr-2"></mat-spinner>
        <span *ngIf="!loading">Sign in</span>
      </button>

      <!-- Footer -->
      <div class="text-center text-sm text-slate-600">
        Don't have an account? 
        <a routerLink="/auth/register" class="font-medium text-slate-700 hover:text-slate-900">Create one</a>
      </div>
    </form>
  </div>
</div>
